openapi: 3.2.0
info:
  title: Calendly Event Types API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: eventTypes
paths:
  /event_types:
    post:
      operationId: eventTypes_create-event-type
      summary: Create Event Type
      description: 'Create a new Event Type


        **NOTE:**

        * Currently, this endpoint only supports one-on-one event types (kind: "solo").


        > `event_types:write`'
      tags:
      - eventTypes
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventTypes_create-event-type_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-event-typeRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-event-typeRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-event-typeRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-event-typeRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-event-typeRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  default: false
                  description: Indicates if the event type is active or not
                owner:
                  type: string
                  format: uri
                  description: The owner for this event type
                name:
                  type: string
                  description: The event type name
                description:
                  type: string
                  description: The event type description
                duration:
                  type: integer
                  minimum: 1
                  maximum: 720
                  description: The length of sessions booked with this event type. Must be one of the duration options if they're provided.
                duration_options:
                  type: array
                  items:
                    type: integer
                  description: A maximum of 4 unique options is allowed. Each option must be >= 1 and <= 720.
                locations:
                  type: array
                  items:
                    $ref: '#/components/schemas/LocationConfiguration'
                  description: Configuration information for each possible location for this event type
                color:
                  type: string
                  pattern: ^#[a-f\d]{6}$
                  description: The hexadecimal color value of the event type's scheduling page
                locale:
                  $ref: '#/components/schemas/EventTypesPostRequestBodyContentApplicationJsonSchemaLocale'
                  description: The locale on the event type, used to determine the language of the event type's scheduling page
              required:
              - owner
              - name
      security:
      - oauth2: []
    get:
      operationId: eventTypes_list-event-types
      summary: List User's Event Types
      description: 'Returns all Event Types associated with a specified User. Use:


        * `organization` to look up all Event Types that belong to the organization


        * `user` to look up a user''s Event Types in an organization


        Either `organization` or `user` are required query params when using this endpoint.


        > `event_types:read`'
      tags:
      - eventTypes
      parameters:
      - name: active
        in: query
        description: Return only active event types if true, only inactive if false, or all event types if this parameter is omitted.
        required: false
        schema:
          type: boolean
      - name: organization
        in: query
        description: View available personal, team, and organization event types associated with the organization's URI.
        required: false
        schema:
          type: string
          format: uri
      - name: user
        in: query
        description: View available personal, team, and organization event types associated with the user's URI.
        required: false
        schema:
          type: string
          format: uri
      - name: user_availability_schedule
        in: query
        description: Used in conjunction with `user` parameter, returns a filtered list of Event Types that use the given primary availability schedule.
        required: false
        schema:
          type: string
          format: uri
      - name: sort
        in: query
        description: 'Order results by the specified field and direction. Accepts comma-separated list of {field}:{direction} values.Supported fields are: name, position, created_at, updated_at. Sort direction is specified as: asc, desc.'
        required: false
        schema:
          type: string
          default: name:asc
      - name: admin_managed
        in: query
        description: Return only admin managed event types if true, exclude admin managed event types if false, or include all event types if this parameter is omitted.
        required: false
        schema:
          type: boolean
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventTypes_list-event-types_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-typesRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-typesRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-typesRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-typesRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-typesRequestInternalServerError'
      security:
      - oauth2: []
  /one_off_event_types:
    post:
      operationId: eventTypes_create-one-off-event-type
      summary: Create One-Off Event Type
      description: 'Creates One-Off Event Type


        > `event_types:write`'
      tags:
      - eventTypes
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventTypes_create-one-off-event-type_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-one-off-event-typeRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-one-off-event-typeRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-one-off-event-typeRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-one-off-event-typeRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-one-off-event-typeRequestInternalServerError'
      requestBody:
        description: Parameters for creating One-Off Event Type
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 55
                  description: Event type name
                host:
                  type: string
                  format: uri
                  description: Host user uri
                co_hosts:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Collection of meeting co-host(s) user URIs
                duration:
                  type: number
                  format: double
                  maximum: 720
                  description: Duration of meeting in minutes
                timezone:
                  type: string
                  description: Time zone used for meeting. Defaults to host's time zone.
                date_setting:
                  $ref: '#/components/schemas/OneOffEventTypesPostRequestBodyContentApplicationJsonSchemaDateSetting'
                location:
                  $ref: '#/components/schemas/OneOffEventTypesPostRequestBodyContentApplicationJsonSchemaLocation'
              required:
              - name
              - host
              - duration
              - date_setting
      security:
      - oauth2: []
  /event_types/{uuid}:
    get:
      operationId: eventTypes_get-event-type
      summary: Get Event Type
      description: 'Returns information about a specified Event Type.


        > `event_types:read`'
      tags:
      - eventTypes
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventTypes_get-event-type_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-typeRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-typeRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-typeRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-typeRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-typeRequestInternalServerError'
      security:
      - oauth2: []
    patch:
      operationId: eventTypes_update-event-type
      summary: Update Event Type
      description: 'Update an existing Event Type


        **NOTE:**

        * Currently, this endpoint only supports one-on-one event types (kind: "solo").


        > `event_types:write`'
      tags:
      - eventTypes
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventTypes_update-event-type_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-typeRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-typeRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-typeRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-typeRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-typeRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: Indicates if the event type is active or not
                name:
                  type: string
                  description: The event type name
                color:
                  type: string
                  pattern: ^#[a-f\d]{6}$
                  description: The hexadecimal color value of the event type's scheduling page
                description:
                  type: string
                  description: The event type description
                duration:
                  type: integer
                  minimum: 1
                  maximum: 720
                  description: The length of sessions booked with this event type. Must be one of the duration options if they're provided.
                duration_options:
                  type: array
                  items:
                    type: integer
                  description: A maximum of 4 unique options is allowed. Each option must be >= 1 and <= 720.
                locale:
                  $ref: '#/components/schemas/EventTypesUuidPatchRequestBodyContentApplicationJsonSchemaLocale'
                  description: The locale on the event type, used to determine the language of the event type's scheduling page
                locations:
                  type: array
                  items:
                    $ref: '#/components/schemas/LocationConfiguration'
                  description: Configuration information for each possible location for this Event Type
      security:
      - oauth2: []
  /event_type_available_times:
    get:
      operationId: eventTypes_list-event-type-available-times
      summary: List Event Type Available Times
      description: 'Returns a list of available times for an event type within a specified date range.


        **NOTE:**

        * Date range can be no greater than 31 days.

        * This endpoint does not support traditional keyset pagination.


        > `availability:read`'
      tags:
      - eventTypes
      parameters:
      - name: event_type
        in: query
        description: The uri associated with the event type
        required: true
        schema:
          type: string
          format: uri
      - name: start_time
        in: query
        description: Start time of the requested availability range. Date cannot be in the past.
        required: true
        schema:
          type: string
          format: date-time
      - name: end_time
        in: query
        description: End time of the requested availability range. Date must be in the future and no greater than 31 days from start_time.
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventTypes_list-event-type-available-times_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-type-available-timesRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-type-available-timesRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-type-available-timesRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-type-available-timesRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-type-available-timesRequestInternalServerError'
      security:
      - oauth2: []
  /event_type_memberships:
    get:
      operationId: eventTypes_list-event-type-memberships
      summary: List Event Type Hosts
      description: 'Fetch list of event type hosts


        > `event_types:read`'
      tags:
      - eventTypes
      parameters:
      - name: event_type
        in: query
        description: The uri associated with the event type
        required: true
        schema:
          type: string
          format: uri
      - name: count
        in: query
