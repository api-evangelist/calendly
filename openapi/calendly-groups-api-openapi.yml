openapi: 3.2.0
info:
  title: Calendly Groups API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: Groups
paths:
  /groups/{uuid}:
    get:
      operationId: groups_get-group
      summary: Get Group
      description: 'Returns information about a specified Group.


        > `groups:read`'
      tags:
      - Groups
      parameters:
      - name: uuid
        in: path
        description: Group unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_get-group_Response_200'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupRequestInternalServerError'
      security:
      - oauth2: []
  /group_relationships/{uuid}:
    get:
      operationId: groups_get-group-relationship
      summary: Get Group Relationship
      description: 'Returns a group relationship by uuid


        > `groups:read`'
      tags:
      - Groups
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_get-group-relationship_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-group-relationshipRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-group-relationshipRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-group-relationshipRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-group-relationshipRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-group-relationshipRequestInternalServerError'
      security:
      - oauth2: []
  /group_relationships:
    get:
      operationId: groups_list-group-relationships
      summary: List Group Relationships
      description: 'Returns a list of group relationships - a given owner can have one membership record, but multiple admin records


        > `groups:read`'
      tags:
      - Groups
      parameters:
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: organization
        in: query
        description: Indicates the results should be filtered by organization
        required: false
        schema:
          type: string
          format: uri
      - name: owner
        in: query
        description: "Indicates the results should be filtered by owner <br>\nOne Of:\n  - Organization Membership URI - `https://api.calendly.com/organization_memberships/AAAAAAAAAAAAAAAA`\n  - Organization Invitation URI - `https://api.calendly.com/organizations/AAAAAAAAAAAAAAAA/invitations/BBBBBBBBBBBBBBBB`\n"
        required: false
        schema:
          type: string
          format: uri
      - name: group
        in: query
        description: Indicates the results should be filtered by group
        required: false
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_list-group-relationships_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-group-relationshipsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-group-relationshipsRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-group-relationshipsRequestForbiddenError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-group-relationshipsRequestInternalServerError'
      security:
      - oauth2: []
  /groups:
    get:
      operationId: groups_list-groups
      summary: List Groups
      description: 'Returns a list of groups.


        > `groups:read`'
      tags:
      - Groups
      parameters:
      - name: organization
        in: query
        description: Return groups that are associated with the organization associated with this URI
        required: true
        schema:
          type: string
          format: uri
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_list-groups_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupsRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-groupsRequestInternalServerError'
      security:
      - oauth2: []
