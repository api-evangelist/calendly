    DataComplianceError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/DataComplianceErrorTitle'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Forbidden
      title: DataComplianceError
    Delete-invitee-dataRequestUnauthorizedError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/DataComplianceDeletionInviteesPostResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/DataComplianceDeletionInviteesPostResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Delete-invitee-dataRequestUnauthorizedError
    Delete-invitee-dataRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/DataComplianceDeletionInviteesPostResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/DataComplianceDeletionInviteesPostResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
