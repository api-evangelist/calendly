openapi: 3.2.0
info:
  title: Calendly Availability API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: Availability
paths:
  /user_availability_schedules/{uuid}:
    get:
      operationId: availability_get-user-availability-schedule
      summary: Get User Availability Schedule
      description: 'This will return the availability schedule of the given UUID.


        > `availability:read`'
      tags:
      - Availability
      parameters:
      - name: uuid
        in: path
        description: The UUID of the availability schedule.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_get-user-availability-schedule_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-user-availability-scheduleRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-user-availability-scheduleRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-user-availability-scheduleRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-user-availability-scheduleRequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: Any type
      security:
      - oauth2: []
  /event_type_availability_schedules:
    get:
      operationId: availability_get-event-type-availability
      summary: List Event Type Availability Schedules
      description: 'Return the availability for an event type


        > `availability:read`'
      tags:
      - Availability
      parameters:
      - name: event_type
        in: query
        description: The URI associated with the event type
        required: true
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_get-event-type-availability_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-type-availabilityRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-type-availabilityRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-type-availabilityRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-type-availabilityRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-event-type-availabilityRequestInternalServerError'
      security:
      - oauth2: []
    patch:
      operationId: availability_update-event-type-availability
      summary: Update Event Type Availability Schedules
      description: 'Update an event type availability schedule


        > `availability:write`'
      tags:
      - Availability
      parameters:
      - name: event_type
        in: query
        description: Event Type uri in which to update the availability schedule
        required: true
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_update-event-type-availability_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-type-availabilityRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-type-availabilityRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-type-availabilityRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-type-availabilityRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-event-type-availabilityRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                availability_rule:
                  $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchRequestBodyContentApplicationJsonSchemaAvailabilityRule'
                availability_setting:
                  $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchRequestBodyContentApplicationJsonSchemaAvailabilitySetting'
                  default: host
                  description: By default every host on the Event Type shares an identical schedule.
              required:
              - availability_rule
      security:
      - oauth2: []
  /user_availability_schedules:
    get:
      operationId: availability_list-user-availability-schedules
      summary: List User Availability Schedules
      description: 'Returns the availability schedules of the given user.


        > `availability:read`'
      tags:
      - Availability
      parameters:
      - name: user
        in: query
        description: A URI reference to a user
        required: true
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_list-user-availability-schedules_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-availability-schedulesRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-availability-schedulesRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-availability-schedulesRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-availability-schedulesRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-availability-schedulesRequestInternalServerError'
      security:
      - oauth2: []
  /user_busy_times:
    get:
      operationId: availability_list-user-busy-times
      summary: List User Busy Times
      description: 'Returns an ascending list of user internal and external scheduled events within a specified date range.


        Date range can be no greater than 1 week (7 days).


        **NOTE:**

        * This endpoint does not support traditional keyset pagination.

        * External events will only be returned for calendars that have "Check for conflicts" configured.


        > `availability:read`'
      tags:
      - Availability
      parameters:
      - name: user
        in: query
        description: The uri associated with the user
        required: true
        schema:
          type: string
          format: uri
      - name: start_time
        in: query
        description: Start time of the requested availability range. Date cannot be in the past.
        required: true
        schema:
          type: string
      - name: end_time
        in: query
        description: End time of the requested availability range. Date must be in the future of start_time.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_list-user-busy-times_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-busy-timesRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-busy-timesRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-busy-timesRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-busy-timesRequestNotFoundError'
        '424':
          description: Unable to access external calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-user-busy-timesRequestInternalServerError'
      security:
      - oauth2: []
components:
  schemas:
    InsufficientScopeErrorTitle:
      type: string
      enum:
      - Insufficient scope
      title: InsufficientScopeErrorTitle
    InsufficientScopeError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/InsufficientScopeErrorTitle'
        message:
          $ref: '#/components/schemas/InsufficientScopeErrorMessage'
        required_scopes:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+:(read|write)$
      required:
      - title
      - message
      - required_scopes
      description: Caller does not have required oauth scopes
      title: InsufficientScopeError
    UserBusyTime:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/UserBusyTimeType'
          description: Indicates whether the scheduled event is internal ('calendly' or 'reserved') or external
        start_time:
          type: string
          format: date-time
          description: The start time of the scheduled event in UTC time
        end_time:
          type: string
          format: date-time
          description: The end time of the scheduled event in UTC time
        buffered_start_time:
          type: string
          format: date-time
          description: The start time of the calendly event, as calculated by any "before" buffer set by the user
        buffered_end_time:
          type: string
          format: date-time
          description: The end time of the calendly event, as calculated by any "after" buffer set by the user
        event:
          $ref: '#/components/schemas/UserBusyTimeEvent'
      required:
      - type
      - start_time
      - end_time
      description: An internal or external scheduled event for a given user
      title: UserBusyTime
    EventTypeAvailabilityScheduleAvailabilityRule:
      type: object
      properties:
        timezone:
          type: string
          description: The timezone for which this Event Type Availability Schedule is originated in.
        uri:
          type: string
          format: uri
          description: Canonical reference (unique identifier) for the Availability Schedule that is referenced in the Event Type.
        name:
          type:
          - string
          - 'null'
          description: The name of the Availability Schedule that is referenced in the Event Type.
        user:
          type: string
          format: uri
          description: A URI reference to a user to be returned if availability_setting is not 'all'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRule'
      title: EventTypeAvailabilityScheduleAvailabilityRule
    EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaOneOf0Title:
      type: string
      enum:
      - Permission Denied
      title: EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaOneOf0Title
    ErrorResponse:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: ErrorResponse
    EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage:
      type: string
      enum:
      - The server encountered an unexpected condition that prevented it from fulfilling the request.
      title: EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage
    List-user-busy-timesRequestBadRequestError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/UserBusyTimesGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/UserBusyTimesGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-user-busy-timesRequestBadRequestError
    availability_get-event-type-availability_Response_200:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeAvailabilitySchedule'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - collection
      - pagination
      title: availability_get-event-type-availability_Response_200
    List-user-busy-timesRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/UserBusyTimesGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/UserBusyTimesGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-user-busy-timesRequestNotFoundError
    Update-event-type-availabilityRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Update-event-type-availabilityRequestNotFoundError
    EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaOneOf0Message:
      type: string
      enum:
      - You do not have permission to access this resource.
      - You do not have permission
      title: EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaOneOf0Message
    Get-event-type-availabilityRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/GetEventTypeAvailabilityRequestForbiddenError0'
      - $ref: '#/components/schemas/InsufficientScopeError'
      title: Get-event-type-availabilityRequestForbiddenError
    UserBusyTimeType:
      type: string
      enum:
      - calendly
      - reserved
      - external
      description: Indicates whether the scheduled event is internal ('calendly' or 'reserved') or external
      title: UserBusyTimeType
    Update-event-type-availabilityRequestBadRequestError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Update-event-type-availabilityRequestBadRequestError
    UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaMessage:
      type: string
      enum:
      - The server could not find the requested resource.
      title: UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaMessage
    UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Resource Not Found
      title: UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaTitle
    EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaMessage:
      type: string
      enum:
      - The server encountered an unexpected condition that prevented it from fulfilling the request.
      title: EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaMessage
    List-user-availability-schedulesRequestUnauthorizedError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-user-availability-schedulesRequestUnauthorizedError
    EventTypeAvailabilitySchedulesPatchRequestBodyContentApplicationJsonSchemaAvailabilityRule:
      type: object
      properties:
        timezone:
          type: string
          description: The timezone for which this Event Type Availability Schedule is originated in.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRule'
          description: 'The rules for an availability schedule.<br>  <span style="color:red">Warning: </span>Updating rules will overwrite all existing rules for the event type. Use the GET endpoint to first retrieve the existing rules and then pass the modified rules to the rules object.'
        user:
          type: string
          format: uri
          description: Required when an admin or org owner is making the call to update a specific users availability schedule
      required:
      - timezone
      title: EventTypeAvailabilitySchedulesPatchRequestBodyContentApplicationJsonSchemaAvailabilityRule
    List-user-availability-schedulesRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-user-availability-schedulesRequestNotFoundError
    EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaOneOf0Title:
      type: string
      enum:
      - Permission Denied
      title: EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaOneOf0Title
    Get-event-type-availabilityRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-event-type-availabilityRequestInternalServerError
    EventTypeAvailabilitySchedulesPatchRequestBodyContentApplicationJsonSchemaAvailabilitySetting:
      type: string
      enum:
      - host
      default: host
      description: By default every host on the Event Type shares an identical schedule.
      title: EventTypeAvailabilitySchedulesPatchRequestBodyContentApplicationJsonSchemaAvailabilitySetting
    availability_update-event-type-availability_Response_200:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedule'
      required:
      - resource
      title: availability_update-event-type-availability_Response_200
    AvailabilityRuleWday:
      type: string
      enum:
      - sunday
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      description: The day of the week for which this Rule should be applied to.
      title: AvailabilityRuleWday
    UpdateEventTypeAvailabilityRequestForbiddenError0:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaOneOf0Title'
        message:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaOneOf0Message'
        details:
