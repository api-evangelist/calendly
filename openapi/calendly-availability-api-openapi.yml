    availability_get-user-availability-schedule_Response_200:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/AvailabilitySchedule'
      required:
      - resource
      title: availability_get-user-availability-schedule_Response_200
    Get-user-availability-scheduleRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-user-availability-scheduleRequestNotFoundError
    Get-event-type-availabilityRequestUnauthorizedError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-event-type-availabilityRequestUnauthorizedError
    GetEventTypeAvailabilityRequestForbiddenError0:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaOneOf0Title'
        message:
          $ref: '#/components/schemas/EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaOneOf0Message'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: GetEventTypeAvailabilityRequestForbiddenError0
    AvailabilitySchedule:
      type: object
      properties:
        uri:
          type: string
          format: uri
          description: A URI reference to this Availability Schedule.
        default:
          type: boolean
          description: This is the default Availability Schedule in use.
        name:
          type: string
          description: The name of this Availability Schedule.
        user:
          type: string
          format: uri
          description: A URI reference to a User.
        timezone:
          type: string
          description: The timezone for which this Availability Schedule is originated in.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRule'
          description: The rules of this Availability Schedule.
      required:
      - uri
      - default
      - name
      - user
      - timezone
      - rules
      description: The availability schedule set by the user.
      title: AvailabilitySchedule
    Update-event-type-availabilityRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/UpdateEventTypeAvailabilityRequestForbiddenError0'
      - $ref: '#/components/schemas/InsufficientScopeError'
      title: Update-event-type-availabilityRequestForbiddenError
    UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage:
      type: string
      enum:
      - The server encountered an unexpected condition that prevented it from fulfilling the request.
      title: UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaMessage
    EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Internal Server Error
      title: EventTypeAvailabilitySchedulesPatchResponsesContentApplicationJsonSchemaTitle
    UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Internal Server Error
      title: UserAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle
    UserBusyTimeEvent:
      type: object
