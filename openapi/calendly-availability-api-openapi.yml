      title: EventTypeAvailabilitySchedulesGetResponsesContentApplicationJsonSchemaTitle
    Get-user-availability-scheduleRequestBadRequestError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/UserAvailabilitySchedulesUuidGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-user-availability-scheduleRequestBadRequestError
    availability_list-user-busy-times_Response_200:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: '#/components/schemas/UserBusyTime'
          description: The set of internal and external scheduled calendar events matching the criteria
      required:
      - collection
      description: Service Response
      title: availability_list-user-busy-times_Response_200
    InsufficientScopeErrorMessage:
      type: string
      enum:
      - This operation requires the scopes listed in the 'required_scopes' array.
      title: InsufficientScopeErrorMessage
    UserNotInOrganizationErrorMessage:
      type: string
      enum:
      - This user is not in your organization
      title: UserNotInOrganizationErrorMessage
    List-user-busy-timesRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/UserNotInOrganizationError'
      - $ref: '#/components/schemas/InsufficientScopeError'
