openapi: 3.2.0
info:
  title: Calendly Notetaker API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: notetaker
paths:
  /meeting_recaps/{uuid}:
    delete:
      operationId: notetaker_delete-meeting-recaps-uuid
      summary: Delete Recap
      description: 'Delete an existing Recap


        **Note:**

        Requires paid plan


        > `meeting_recaps:write`'
      tags:
      - notetaker
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-meeting-recaps-uuidRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-meeting-recaps-uuidRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-meeting-recaps-uuidRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-meeting-recaps-uuidRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-meeting-recaps-uuidRequestInternalServerError'
      security:
      - oauth2: []
    get:
      operationId: notetaker_get-meeting-recaps-uuid-recap
      summary: Get Recap
      description: 'Returns the recap associated with a meeting if it is available.


        **Note:**

        Requires paid plan


        > `meeting_recaps:read`'
      tags:
      - notetaker
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notetaker_get-meeting-recaps-uuid-recap_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-meeting-recaps-uuid-recapRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-meeting-recaps-uuid-recapRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-meeting-recaps-uuid-recapRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-meeting-recaps-uuid-recapRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-meeting-recaps-uuid-recapRequestInternalServerError'
      security:
      - oauth2: []
    patch:
      operationId: notetaker_update-meeting-recaps-uuid
      summary: Update Recap
      description: 'Update an existing Recap. You may send any combination of the optional body fields; omitted fields are left unchanged. Unknown top-level properties are rejected.


        **Note:**

        Requires paid plan


        > `meeting_recaps:write`'
      tags:
      - notetaker
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notetaker_update-meeting-recaps-uuid_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-meeting-recaps-uuidRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-meeting-recaps-uuidRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-meeting-recaps-uuidRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-meeting-recaps-uuidRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-meeting-recaps-uuidRequestInternalServerError'
      requestBody:
        description: Optional markdown fields to update.
        content:
          application/json:
            schema:
              type: object
              properties:
                summary_md:
                  type:
                  - string
                  - 'null'
                  description: Summary in Markdown.
                action_items_md:
                  type:
                  - string
                  - 'null'
                  description: Action items in Markdown.
                discussion_md:
                  type:
                  - string
                  - 'null'
                  description: Discussion notes in Markdown.
      security:
      - oauth2: []
  /meeting_recaps/{uuid}/transcript:
    get:
      operationId: notetaker_get-transcript-meeting-recaps
      summary: Get Transcript
      description: 'Returns the transcript associated with a meeting recap if it is available.


        **Note:**

        Requires paid plan


        > `meeting_recaps:read`'
      tags:
      - notetaker
      parameters:
      - name: uuid
        in: path
        description: The meeting recap uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notetaker_get-transcript-meeting-recaps_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-transcript-meeting-recapsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-transcript-meeting-recapsRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-transcript-meeting-recapsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-transcript-meeting-recapsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-transcript-meeting-recapsRequestInternalServerError'
      security:
      - oauth2: []
  /meeting_recaps:
    get:
      operationId: notetaker_list-meeting-recaps
      summary: List Recaps
      description: 'Returns a paginated list of meeting recaps accessible to the authenticated user. By default, returns **Available** recaps only. Use the `status` query parameter to retrieve `processing` or `unavailable` recaps. Supports additional filtering by scheduled event, attendee, or date range.


        Returns both Calendly-scheduled and external event recaps in a single collection. The `event` field is null for external events where no Calendly scheduled event exists.


        **Note:**

        Requires paid plan


        > `meeting_recaps:read`'
      tags:
      - notetaker
      parameters:
      - name: event
        in: query
        description: Filter results to recaps associated with a specific event scheduled via Calendly. This field corresponds to the `/scheduled_events` endpoint.
        required: false
        schema:
          type: string
          format: uri
      - name: start_time
        in: query
        description: Return recaps for meetings that end after (or end at) this time (ISO 8601).
        required: false
        schema:
          type: string
          format: date-time
      - name: end_time
        in: query
        description: Return recaps for meetings that start before (or start at) this time (ISO 8601).
        required: false
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: 'Filter by recap availability. When omitted, returns **Available** recaps only.


          - `available` — completed recaps with summary content

          - `processing` — recaps still being generated

          - `unavailable` — recaps that cannot be retrieved'
        required: false
        schema:
          $ref: '#/components/schemas/MeetingRecapsGetParametersStatus'
      - name: attendee
        in: query
        description: Filter results to recaps that include a specific attendee email address.
        required: false
        schema:
          type: string
          format: email
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notetaker_list-meeting-recaps_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-meeting-recapsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-meeting-recapsRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-meeting-recapsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-meeting-recapsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-meeting-recapsRequestInternalServerError'
      security:
      - oauth2: []
components:
  schemas:
    ZoomConferenceDataSettingsGlobalDialInNumbersItems:
      type: object
      properties:
        number:
          type: string
          description: Phone number
        country:
          type: string
          description: Country code
        type:
          type: string
        city:
          type: string
        country_name:
          type: string
      title: ZoomConferenceDataSettingsGlobalDialInNumbersItems
    InsufficientScopeError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/InsufficientScopeErrorTitle'
        message:
          $ref: '#/components/schemas/InsufficientScopeErrorMessage'
        required_scopes:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+:(read|write)$
      required:
      - title
      - message
      - required_scopes
      description: Caller does not have required oauth scopes
      title: InsufficientScopeError
    MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Internal Server Error
      title: MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaTitle
    Update-meeting-recaps-uuidRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidPatchResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidPatchResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Update-meeting-recaps-uuidRequestNotFoundError
    MeetingRecapsErrorMessage:
      type: string
      enum:
      - Please upgrade to a paid Calendly account
      - You do not have permission to access this resource
      - Meeting recap access is not available. Required features are not enabled for your account
      title: MeetingRecapsErrorMessage
    InviteeSpecifiedLocationType:
      type: string
      enum:
      - ask_invitee
      description: The event location selected by the invitee
      title: InviteeSpecifiedLocationType
    ZoomConferenceDataId:
      oneOf:
      - type: string
      - type: integer
      description: The conference ID provided by Zoom
      title: ZoomConferenceDataId
    Delete-meeting-recaps-uuidRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/MeetingRecapsError'
      - $ref: '#/components/schemas/InsufficientScopeError'
      title: Delete-meeting-recaps-uuidRequestForbiddenError
    Notetaker_list-meeting-recaps_Response_200:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: '#/components/schemas/MeetingRecapListItem'
          description: The set of meeting recaps matching the criteria
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - collection
      - pagination
      description: Service response
      title: Notetaker_list-meeting-recaps_Response_200
    MicrosoftTeamsConferenceData:
      type: object
      properties:
        id:
          type: string
          description: The conference ID provided by Microsoft Teams
        audioConferencing:
          oneOf:
          - $ref: '#/components/schemas/MicrosoftTeamsConferenceDataAudioConferencing'
          - type: 'null'
      description: The conference metadata supplied by Microsoft Teams
      title: MicrosoftTeamsConferenceData
    Update-meeting-recaps-uuidRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidPatchResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidPatchResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Update-meeting-recaps-uuidRequestInternalServerError
    MeetingRecapsUuidDeleteResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Internal Server Error
      title: MeetingRecapsUuidDeleteResponsesContentApplicationJsonSchemaTitle
    Notetaker_get-transcript-meeting-recaps_Response_200:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Transcript'
      required:
      - resource
      title: Notetaker_get-transcript-meeting-recaps_Response_200
    Delete-meeting-recaps-uuidRequestUnauthorizedError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidDeleteResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidDeleteResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Delete-meeting-recaps-uuidRequestUnauthorizedError
    GotoMeetingConference:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GotoMeetingConferenceType'
          description: The event location is a GoToMeeting conference
        status:
          oneOf:
          - $ref: '#/components/schemas/GotoMeetingConferenceStatus'
          - type: 'null'
          description: Indicates the current status of the GoToMeeting conference<br/>&nbsp; * Expect only `pushed` status to have non-`null` values for `join_url` & `data` fields.<br/>&nbsp; - `processing` Location details generation pending<br/>&nbsp; - `initiated` Requesting location details from GoToMeeting<br/>&nbsp; - `pushed` Location details are available<br/>&nbsp; - `failed` Error occurred or event has been canceled<br/>&nbsp; - `null` Location details are no longer available
        join_url:
          type:
          - string
          - 'null'
          format: uri
          description: GoToMeeting conference meeting url
        data:
          oneOf:
          - $ref: '#/components/schemas/GotoMeetingConferenceData'
          - type: 'null'
          description: The conference metadata supplied by GoToMeeting
      required:
      - type
      - status
      - join_url
      - data
      description: Details about an Event that will take place using a GotoMeeting conference. Location details will not be available 6 months after event has occurred.
      title: GotoMeetingConference
    List-meeting-recapsRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/MeetingRecapsError'
      - $ref: '#/components/schemas/InsufficientScopeError'
      title: List-meeting-recapsRequestForbiddenError
    InboundCall:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InboundCallType'
          description: "\t\nIndicates that the invitee will call the event host"
        location:
          type: string
          description: The phone number the invitee will use to call the event host (publisher)
        additional_info:
          type: string
      required:
      - type
      - location
      description: Invitee will call meeting publisher at the specified phone number
      title: InboundCall
    MeetingRecapsUuidTranscriptGetResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Internal Server Error
      title: MeetingRecapsUuidTranscriptGetResponsesContentApplicationJsonSchemaTitle
    InboundCallType:
      type: string
      enum:
      - inbound_call
      description: "\t\nIndicates that the invitee will call the event host"
      title: InboundCallType
    Get-meeting-recaps-uuid-recapRequestUnauthorizedError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-meeting-recaps-uuid-recapRequestUnauthorizedError
    GoogleConferenceStatus:
      type: string
      enum:
      - processing
      - initiated
      - pushed
      - failed
      description: Indicates the current status of the Google conference<br/>&nbsp; * Expect only `pushed` status to have a non-`null` value for the `join_url` field.<br/>&nbsp; - `processing` Location details generation pending<br/>&nbsp; - `initiated` Requesting location details from Google<br/>&nbsp; - `pushed` Location details are available<br/>&nbsp; - `failed` Error occurred or event has been canceled<br/>&nbsp; - `null` Location details are no longer available
      title: GoogleConferenceStatus
    GoogleConferenceType:
      type: string
      enum:
      - google_conference
      description: The event location is a Google Meet or Hangouts conference
      title: GoogleConferenceType
    WebExConference:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WebExConferenceType'
          description: The event location is a WebEx conference
        status:
          oneOf:
          - $ref: '#/components/schemas/WebExConferenceStatus'
          - type: 'null'
          description: Indicates the current status of the WebEx conference<br/>&nbsp; * Expect only `pushed` status to have non-`null` values for `join_url` & `data` fields.<br/>&nbsp; - `processing` Location details generation pending<br/>&nbsp; - `initiated` Requesting location details from WebEx<br/>&nbsp; - `pushed` Location details are available<br/>&nbsp; - `failed` Error occurred or event has been canceled<br/>&nbsp; - `null` Location details are no longer available
        join_url:
          type:
          - string
          - 'null'
          format: uri
          description: WebEx conference meeting url
        data:
          oneOf:
          - $ref: '#/components/schemas/WebExConferenceData'
          - type: 'null'
          description: The conference metadata supplied by GoToMeeting
      required:
      - type
      - status
      - join_url
      - data
      description: Details about an Event that will take place using a WebEx conference. Location details will not be available 6 months after event has occurred.
      title: WebExConference
    InPersonMeetingType:
      type: string
      enum:
      - physical
      description: Indicates that the event will be an in-person meeting.
      title: InPersonMeetingType
    CustomLocation:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CustomLocationType'
          description: The event location doesn't fall into a standard category defined by the event host (publisher)
        location:
          type:
          - string
          - 'null'
          description: The location description provided by the event host (publisher)
      required:
      - type
      - location
      description: Use this to describe an existing Calendly-supported event location.
      title: CustomLocation
    Get-meeting-recaps-uuid-recapRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-meeting-recaps-uuid-recapRequestNotFoundError
    MeetingRecapsUuidTranscriptGetResponsesContentApplicationJsonSchemaMessage:
      type: string
      enum:
      - The server encountered an unexpected condition that prevented it from fulfilling the request.
      title: MeetingRecapsUuidTranscriptGetResponsesContentApplicationJsonSchemaMessage
    Get-meeting-recaps-uuid-recapRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-meeting-recaps-uuid-recapRequestInternalServerError
    Delete-meeting-recaps-uuidRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidDeleteResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidDeleteResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Delete-meeting-recaps-uuidRequestInternalServerError
    MicrosoftTeamsConferenceStatus:
      type: string
      enum:
      - processing
      - initiated
      - pushed
      - failed
      description: Indicates the current status of the Microsoft Teams conference<br/>&nbsp; * Expect only `pushed` status to have non-`null` values for `join_url` & `data` fields.<br/>&nbsp; - `processing` Location details generation pending<br/>&nbsp; - `initiated` Requesting location details from MS Teams<br/>&nbsp; - `pushed` Location details are available<br/>&nbsp; - `failed` Error occurred or event has been canceled<br/>&nbsp; - `null` Location details are no longer available
      title: MicrosoftTeamsConferenceStatus
    ZoomConferenceStatus:
      type: string
      enum:
      - processing
      - initiated
      - pushed
      - failed
      description: Indicates the current status of the Zoom conference<br/>&nbsp; * Expect only `pushed` status to have non-`null` values for `join_url` & `data` fields.<br/>&nbsp; - `processing` Location details generation pending<br/>&nbsp; - `initiated` Requesting location details from Zoom<br/>&nbsp; - `pushed` Location details are available<br/>&nbsp; - `failed` Error occurred or event has been canceled<br/>&nbsp; - `null` Location details are no longer available
      title: ZoomConferenceStatus
    Get-transcript-meeting-recapsRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsUuidTranscriptGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsUuidTranscriptGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-transcript-meeting-recapsRequestInternalServerError
    ZoomConference:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ZoomConferenceType'
          description: The event location is a Zoom conference
        status:
          oneOf:
          - $ref: '#/components/schemas/ZoomConferenceStatus'
          - type: 'null'
          description: Indicates the current status of the Zoom conference<br/>&nbsp; * Expect only `pushed` status to have non-`null` values for `join_url` & `data` fields.<br/>&nbsp; - `processing` Location details generation pending<br/>&nbsp; - `initiated` Requesting location details from Zoom<br/>&nbsp; - `pushed` Location details are available<br/>&nbsp; - `failed` Error occurred or event has been canceled<br/>&nbsp; - `null` Location details are no longer available
        join_url:
          type:
          - string
          - 'null'
          format: uri
          description: Zoom meeting url
        data:
          oneOf:
          - $ref: '#/components/schemas/ZoomConferenceData'
          - type: 'null'
          description: The conference metadata supplied by Zoom
      required:
      - type
      - status
      - join_url
      - data
      description: Meeting will take place in a Zoom conference. Location details will not be available 6 months after event has occurred.
      title: ZoomConference
    List-meeting-recapsRequestBadRequestError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/MeetingRecapsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/MeetingRecapsGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-meeting-recapsRequestBadRequestError
