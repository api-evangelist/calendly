openapi: 3.2.0
info:
  title: Calendly Organizations API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: Organizations
paths:
  /organizations/{uuid}:
    get:
      operationId: organizations_get-organization
      summary: Get Organization
      description: 'Returns the details of a specified Organization.


        > `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: uuid
        in: path
        description: The organization's unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_get-organization_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organizationRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organizationRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organizationRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organizationRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organizationRequestInternalServerError'
      security:
      - oauth2: []
  /organizations/{org_uuid}/invitations/{uuid}:
    get:
      operationId: organizations_get-organization-invitation
      summary: Get Organization Invitation
      description: 'Returns an Organization Invitation that was sent to the organization''s members.


        > `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: org_uuid
        in: path
        description: The organization’s unique identifier
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: The organization invitation's unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_get-organization-invitation_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-invitationRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-invitationRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-invitationRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-invitationRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-invitationRequestInternalServerError'
      security:
      - oauth2: []
    delete:
      operationId: organizations_revoke-organization-invitation
      summary: Revoke User's Organization Invitation
      description: 'Use this to revoke an Organization Invitation to an organization. Once revoked, the invitation link that was sent to the invitee is no longer valid.


        > `organizations:write`'
      tags:
      - Organizations
      parameters:
      - name: org_uuid
        in: path
        description: The organization’s unique identifier
        required: true
        schema:
          type: string
      - name: uuid
        in: path
        description: The organization invitation's unique identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoke-organization-invitationRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoke-organization-invitationRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoke-organization-invitationRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoke-organization-invitationRequestInternalServerError'
      security:
      - oauth2: []
  /organization_memberships/{uuid}:
    get:
      operationId: organizations_get-organization-membership
      summary: Get Organization Membership
      description: 'Returns information about a user''s Organization Membership


        > `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: uuid
        in: path
        description: The organization membership's unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_get-organization-membership_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-membershipRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-membershipRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-membershipRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-membershipRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-organization-membershipRequestInternalServerError'
      security:
      - oauth2: []
    delete:
      operationId: organizations_delete-organization-membership
      summary: Remove User from Organization
      description: 'Removes a user from an organization.


        Notes:


        * To remove users, the caller must have admin rights for the organization


        * An organization owner can''t be removed


        > `organizations:write`'
      tags:
      - Organizations
      parameters:
      - name: uuid
        in: path
        description: The organization membership's unique identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-organization-membershipRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-organization-membershipRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-organization-membershipRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-organization-membershipRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-organization-membershipRequestInternalServerError'
      security:
      - oauth2: []
  /teams/{team_uuid}:
    get:
      operationId: organizations_get-team
      summary: Get Team
      description: 'Returns a single Team.


        > #### Required scopes: `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: team_uuid
        in: path
        description: Team UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations_get-team_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-teamRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-teamRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-teamRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-teamRequestNotFoundError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-teamRequestTooManyRequestsError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-teamRequestInternalServerError'
      security:
      - oauth2: []
  /organizations/{uuid}/invitations:
    post:
      operationId: organizations_create-organization-invitation
      summary: Invite User to Organization
      description: 'Invites a user to an organization.


        > `organizations:write`'
      tags:
      - Organizations
      parameters:
      - name: uuid
        in: path
        description: The organization's unique identifier
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_create-organization-invitation_Response_201'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-organization-invitationRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-organization-invitationRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-organization-invitationRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-organization-invitationRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The email of the user being invited
              required:
              - email
      security:
      - oauth2: []
    get:
      operationId: organizations_list-organization-invitations
      summary: List Organization Invitations
      description: 'Returns a list of Organization Invitations that were sent to the organization''s members.


        > `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: uuid
        in: path
        description: The organization's unique identifier
        required: true
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Order results by the field name and direction specified (ascending or descending). Returns multiple sets of results in a comma-separated list.
        required: false
        schema:
          type: string
          default: created_at:asc
      - name: email
        in: query
        description: Indicates if the results should be filtered by email address
        required: false
        schema:
          type: string
          format: email
      - name: status
        in: query
        description: Indicates if the results should be filtered by status  ("pending", "accepted", or "declined")
        required: false
        schema:
          $ref: '#/components/schemas/OrganizationsUuidInvitationsGetParametersStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_list-organization-invitations_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-invitationsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-invitationsRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-invitationsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-invitationsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-invitationsRequestInternalServerError'
      security:
      - oauth2: []
  /organization_memberships:
    get:
      operationId: organizations_list-organization-memberships
      summary: List Organization Memberships
      description: 'Use this to list the Organization Memberships for all users belonging to an organization, use:


        * `user` to look up a user''s membership in an organization


        * `organization` to look up all users that belong to the organization


        This endpoint can also be used to retrieve your organization URI.


        > `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: email
        in: query
        description: Indicates if the results should be filtered by email address
        required: false
        schema:
          type: string
          format: email
      - name: organization
        in: query
        description: Indicates if the results should be filtered by organization
        required: false
        schema:
          type: string
          format: uri
      - name: user
        in: query
        description: Indicates if the results should be filtered by user
        required: false
        schema:
          type: string
          format: uri
      - name: role
        in: query
        description: Indicates if the results should be filtered by role
        required: false
        schema:
          $ref: '#/components/schemas/OrganizationMembershipsGetParametersRole'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_list-organization-memberships_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-membershipsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-membershipsRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-membershipsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-membershipsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-organization-membershipsRequestInternalServerError'
      security:
      - oauth2: []
  /teams:
    get:
      operationId: organizations_list-teams
      summary: List Teams
      description: 'Returns a paginated list of Teams matching the requested user.


        > #### Required scopes: `organizations:read`'
      tags:
      - Organizations
      parameters:
      - name: user
        in: query
        description: Filter results to Teams associated with a specific user
        required: false
        schema:
          type: string
          format: uri
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations_list-teams_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-teamsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-teamsRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-teamsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-teamsRequestNotFoundError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-teamsRequestTooManyRequestsError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-teamsRequestInternalServerError'
      security:
      - oauth2: []
components:
  schemas:
    InsufficientScopeError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/InsufficientScopeErrorTitle'
        message:
          $ref: '#/components/schemas/InsufficientScopeErrorMessage'
        required_scopes:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+:(read|write)$
      required:
      - title
      - message
      - required_scopes
      description: Caller does not have required oauth scopes
      title: InsufficientScopeError
    ListOrganizationInvitationsRequestForbiddenError0:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/OrganizationsUuidInvitationsGetResponsesContentApplicationJsonSchemaOneOf0Title'
        message:
          $ref: '#/components/schemas/OrganizationsUuidInvitationsGetResponsesContentApplicationJsonSchemaOneOf0Message'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: ListOrganizationInvitationsRequestForbiddenError0
    Revoke-organization-invitationRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/OrganizationsOrgUuidInvitationsUuidDeleteResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/OrganizationsOrgUuidInvitationsUuidDeleteResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Revoke-organization-invitationRequestNotFoundError
    Revoke-organization-invitationRequestUnauthorizedError:
      type: object
      properties:
