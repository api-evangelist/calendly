    OrganizationInvitationDeleteError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/OrganizationInvitationDeleteErrorTitle'
        message:
          $ref: '#/components/schemas/OrganizationInvitationDeleteErrorMessage'
      description: Permission Denied
      title: OrganizationInvitationDeleteError
    OrganizationMembershipUserLocale:
      type: string
      enum:
      - en
      - fr
      - es
      - de
      - pt
      - ps
      description: The user's language preference
      title: OrganizationMembershipUserLocale
    OrgMembershipDeleteError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/OrgMembershipDeleteErrorTitle'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Caller not authorized to perform this action
      title: OrgMembershipDeleteError
    OrganizationsUuidInvitationsGetParametersStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
      title: OrganizationsUuidInvitationsGetParametersStatus
    List-teamsRequestForbiddenError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/TeamsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/TeamsGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-teamsRequestForbiddenError
    OrganizationsUuidInvitationsGetResponsesContentApplicationJsonSchemaOneOf0Message:
      type: string
      enum:
      - You do not have permission to access this resource.
      - You do not have permission
      title: OrganizationsUuidInvitationsGetResponsesContentApplicationJsonSchemaOneOf0Message
    List-teamsRequestBadRequestError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/TeamsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/TeamsGetResponsesContentApplicationJsonSchemaMessage'
        details:
