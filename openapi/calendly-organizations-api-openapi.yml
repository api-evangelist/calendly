        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Revoke-organization-invitationRequestUnauthorizedError
    UserNotInOrgGenericErrorTitle:
      type: string
      enum:
      - Permission Denied
      title: UserNotInOrgGenericErrorTitle
    OrganizationMembershipRole:
      type: string
      enum:
      - user
      - admin
      - owner
      description: The user's role in the organization
      title: OrganizationMembershipRole
    organizations_list-organization-memberships_Response_200:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - collection
      - pagination
      description: Service response
      title: organizations_list-organization-memberships_Response_200
    GetOrganizationRequestForbiddenError0:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/OrganizationsUuidGetResponsesContentApplicationJsonSchemaOneOf0Title'
        message:
          $ref: '#/components/schemas/OrganizationsUuidGetResponsesContentApplicationJsonSchemaOneOf0Message'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: GetOrganizationRequestForbiddenError0
    List-organization-membershipsRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/OrganizationMembershipsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/OrganizationMembershipsGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
