      title: List-teamsRequestUnauthorizedError
    List-teamsRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/TeamsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/TeamsGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-teamsRequestInternalServerError
    Get-teamRequestBadRequestError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/TeamsTeamUuidGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/TeamsTeamUuidGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
