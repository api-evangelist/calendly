openapi: 3.2.0
info:
  title: Calendly Scheduled Events API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: scheduledEvents
paths:
  /scheduled_events/{uuid}/cancellation:
    post:
      operationId: scheduledEvents_create-scheduled-event-cancellation
      summary: Cancel Event
      description: 'Cancels specified event.


        > `scheduled_events:write`'
      tags:
      - scheduledEvents
      parameters:
      - name: uuid
        in: path
        description: The event's unique indentifier
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_create-scheduled-event-cancellation_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-scheduled-event-cancellationRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-scheduled-event-cancellationRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-scheduled-event-cancellationRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-scheduled-event-cancellationRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-scheduled-event-cancellationRequestInternalServerError'
      requestBody:
        description: Optional cancellation reason.
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 10000
                  description: Reason for cancellation
      security:
      - oauth2: []
  /invitees:
    post:
      operationId: scheduledEvents_create-event-invitee
      summary: Create Event Invitee (Scheduling API)
      description: 'Creates a new booking for an event invitee. Use this endpoint to book an invitee directly from your app without redirects, iframes, or Calendly-hosted UI.


        Standard notifications, calendar invites, reschedules, and workflows run as if booked via the Calendly UI.


        **NOTE:**

        * Access to this endpoint is limited to Calendly users on paid plans (Standard and above). Users on the Free plan will receive a 403 Forbidden response.


        > `scheduled_events:write`'
      tags:
      - scheduledEvents
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_create-event-invitee_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post-inviteeRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post-inviteeRequestUnauthorizedError'
        '403':
          description: Caller not authorized to perform this action or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post-inviteeRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post-inviteeRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post-inviteeRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  format: uri
                  description: 'Canonical reference (unique identifier) for the event type being scheduled '
                start_time:
                  type: string
                  format: date-time
                  description: The start time in UTC of the scheduled event
                invitee:
                  $ref: '#/components/schemas/InviteesPostRequestBodyContentApplicationJsonSchemaInvitee'
                location:
                  $ref: '#/components/schemas/InviteeLocation'
                questions_and_answers:
                  type: array
                  items:
                    $ref: '#/components/schemas/InviteeQuestionAndAnswer'
                tracking:
                  $ref: '#/components/schemas/InviteeTracking'
                event_guests:
                  type: array
                  items:
                    type: string
                    format: email
                  description: Emails of invitee guests. Max 10.
              required:
              - event_type
              - start_time
              - invitee
      security:
      - oauth2: []
  /invitee_no_shows:
    post:
      operationId: scheduledEvents_create-invitee-no-show
      summary: Create Invitee No Show
      description: 'Marks an Invitee as a No Show.


        > `scheduled_events:write`'
      tags:
      - scheduledEvents
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_create-invitee-no-show_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-invitee-no-showRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-invitee-no-showRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-invitee-no-showRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-invitee-no-showRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-invitee-no-showRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invitee:
                  type: string
                  format: uri
      security:
      - oauth2: []
  /invitee_no_shows/{uuid}:
    delete:
      operationId: scheduledEvents_delete-invitee-no-show
      summary: Delete Invitee No Show
      description: 'Undoes marking an Invitee as a No Show.


        > `scheduled_events:write`'
      tags:
      - scheduledEvents
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-invitee-no-showRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-invitee-no-showRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-invitee-no-showRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-invitee-no-showRequestInternalServerError'
      security:
      - oauth2: []
    get:
      operationId: scheduledEvents_get-invitee-no-show
      summary: Get Invitee No Show
      description: 'Returns information about a specified Invitee No Show.


        > `scheduled_events:read`'
      tags:
      - scheduledEvents
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_get-invitee-no-show_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-invitee-no-showRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-invitee-no-showRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-invitee-no-showRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-invitee-no-showRequestNotFoundError'
      security:
      - oauth2: []
  /scheduled_events/{uuid}:
    get:
      operationId: scheduledEvents_get-scheduled-event
      summary: Get Event
      description: 'Returns information about a specified Event.


        > `scheduled_events:read`'
      tags:
      - scheduledEvents
      parameters:
      - name: uuid
        in: path
        description: The event's unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_get-scheduled-event_Response_200'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-eventRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-eventRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-eventRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-eventRequestInternalServerError'
      security:
      - oauth2: []
  /scheduled_events/{event_uuid}/invitees/{invitee_uuid}:
    get:
      operationId: scheduledEvents_get-event-invitee
      summary: Get Event Invitee
      description: 'Returns information about a specified Invitee (person invited to an event).


        > `scheduled_events:read`'
      tags:
      - scheduledEvents
      parameters:
      - name: event_uuid
        in: path
        description: The event's unique identifier
        required: true
        schema:
          type: string
      - name: invitee_uuid
        in: path
        description: The invitee's unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_get-event-invitee_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-event-inviteesRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-event-inviteesRequestUnauthorizedError'
        '403':
          description: Caller not authorized to view event or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-event-inviteesRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-event-inviteesRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-scheduled-event-inviteesRequestInternalServerError'
      security:
      - oauth2: []
  /scheduled_events/{uuid}/invitees:
    get:
      operationId: scheduledEvents_list-event-invitees
      summary: List Event Invitees
      description: 'Returns a list of Invitees for an event.


        > `scheduled_events:read`'
      tags:
      - scheduledEvents
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: Indicates if the invitee "canceled" or still "active"
        required: false
        schema:
          $ref: '#/components/schemas/ScheduledEventsUuidInviteesGetParametersStatus'
      - name: sort
        in: query
        description: 'Order results by the **created_at** field and direction specified: ascending ("asc") or descending ("desc")'
        required: false
        schema:
          type: string
          default: created_at:asc
      - name: email
        in: query
        description: Indicates if the results should be filtered by email address
        required: false
        schema:
          type: string
          format: email
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_list-event-invitees_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-inviteesRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-inviteesRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-inviteesRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-inviteesRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-event-inviteesRequestInternalServerError'
      security:
      - oauth2: []
  /scheduled_events:
    get:
      operationId: scheduledEvents_list-scheduled-events
      summary: List Events
      description: 'Returns a list of Events.


        * Pass `organization` parameter to return events for that organization (requires admin/owner privilege)

        * Pass `user` parameter to return events for a specific User

        * Pass `group` parameter to return events for a specific Group (requires organization admin/owner or group admin privilege)


        **NOTES:**

        * If you are the admin/owner of the organization, you can use both `organization` and `user` to get a list of events for a specific user within your organization.

        * If you are the admin/owner of the organization, you can use both `organization` and `group` to get a list of events for a specific group within your organization.


        * `user` can only be used alone when requesting your own personal events. This will return your events within any organization that you are currently in or were a part of in the past.


        > `scheduled_events:read`'
      tags:
      - scheduledEvents
      parameters:
      - name: user
        in: query
        description: Return events that are scheduled with the user associated with this URI
        required: false
        schema:
          type: string
          format: uri
      - name: organization
        in: query
        description: Return events that are scheduled with the organization associated with this URI
        required: false
        schema:
          type: string
          format: uri
      - name: invitee_email
        in: query
        description: Return events that are scheduled with the invitee associated with this email address
        required: false
        schema:
          type: string
          format: email
      - name: status
        in: query
        description: Whether the scheduled event is `active` or `canceled`
        required: false
        schema:
          $ref: '#/components/schemas/ScheduledEventsGetParametersStatus'
      - name: sort
        in: query
        description: 'Order results by the specified field and direction. Accepts comma-separated list of {field}:{direction} values.

          Supported fields are: start_time.

          Sort direction is specified as: asc, desc.'
        required: false
        schema:
          type: string
      - name: min_start_time
        in: query
        description: 'Include events with start times after this time (sample time format: "2020-01-02T03:04:05.678123Z"). This time should use the UTC timezone.'
        required: false
        schema:
          type: string
          format: date-time
      - name: max_start_time
        in: query
        description: 'Include events with start times prior to this time (sample time format: "2020-01-02T03:04:05.678123Z"). This time should use the UTC timezone.'
        required: false
        schema:
          type: string
          format: date-time
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: group
        in: query
        description: Return events that are scheduled with the group associated with this URI
        required: false
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduledEvents_list-scheduled-events_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-scheduled-eventsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-scheduled-eventsRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-scheduled-eventsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-scheduled-eventsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-scheduled-eventsRequestInternalServerError'
      security:
      - oauth2: []
components:
  schemas:
    ZoomConferenceDataSettingsGlobalDialInNumbersItems:
      type: object
      properties:
        number:
          type: string
          description: Phone number
        country:
          type: string
          description: Country code
        type:
          type: string
        city:
          type: string
        country_name:
          type: string
      title: ZoomConferenceDataSettingsGlobalDialInNumbersItems
    InviteeLocation:
      oneOf:
      - $ref: '#/components/schemas/InviteeInPersonMeeting'
      - $ref: '#/components/schemas/InviteeInboundCall'
      - $ref: '#/components/schemas/InviteeOutboundCall'
      - $ref: '#/components/schemas/InviteeZoomConference'
      - $ref: '#/components/schemas/InviteeGoogleConference'
      - $ref: '#/components/schemas/InviteeGotoMeetingConference'
      - $ref: '#/components/schemas/InviteeMicrosoftTeamsConference'
      - $ref: '#/components/schemas/InviteeWebExConference'
      - $ref: '#/components/schemas/InviteeInviteeSpecifiedLocation'
      - $ref: '#/components/schemas/InviteeCustomLocation'
      description: "The polymorphic base type for an event location that Calendly supports.  \n\nNote: \n- Location.kind must be supplied if location is defined.\n- Location must match location specified on the EventType.\n- Do not pass the location object for an EventType with a round_robin pooling_type."
      title: InviteeLocation
    InsufficientScopeError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/InsufficientScopeErrorTitle'
        message:
          $ref: '#/components/schemas/InsufficientScopeErrorMessage'
        required_scopes:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+:(read|write)$
      required:
      - title
      - message
      - required_scopes
      description: Caller does not have required oauth scopes
      title: InsufficientScopeError
    InviteePaymentCurrency:
      type: string
      enum:
      - AUD
      - CAD
      - EUR
      - GBP
      - USD
      description: The currency format that the payment is in.
      title: InviteePaymentCurrency
    List-scheduled-eventsRequestUnauthorizedError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/ScheduledEventsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/ScheduledEventsGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-scheduled-eventsRequestUnauthorizedError
    InviteePayment:
      type: object
      properties:
        external_id:
          type: string
          description: Unique identifier for the payment
        provider:
          $ref: '#/components/schemas/InviteePaymentProvider'
          description: Payment provider
        amount:
          type: string
          title: float
          description: The amount of the payment
        currency:
          $ref: '#/components/schemas/InviteePaymentCurrency'
          description: The currency format that the payment is in.
        terms:
          type:
          - string
          - 'null'
          description: Terms of the payment
        successful:
          type: boolean
          description: Indicates whether the payment was successfully processed
      required:
      - external_id
      - provider
      - amount
      - currency
      - terms
      - successful
      description: Invitee payment
      title: InviteePayment
    Guest:
      type: object
      properties:
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - email
      - created_at
      - updated_at
      description: An individual whom an invitee has invited to be a guest attendee to an event
      title: Guest
    InviteeInboundCallKind:
      type: string
      enum:
      - inbound_call
      description: Indicates that the invitee will call the event host
      title: InviteeInboundCallKind
    ScheduledEventsGetResponsesContentApplicationJsonSchemaMessage:
      type: string
      enum:
      - The server encountered an unexpected condition that prevented it from fulfilling the request.
      title: ScheduledEventsGetResponsesContentApplicationJsonSchemaMessage
    Cancellation:
      type: object
      properties:
        canceled_by:
          type: string
          description: Name of the person whom canceled
        reason:
          type:
          - string
          - 'null'
          description: Reason that the cancellation occurred
        canceler_type:
          $ref: '#/components/schemas/CancellationCancelerType'
        created_at:
          type: string
          format: date-time
          description: The moment when the cancellation was created
      required:
      - canceled_by
      - reason
      - canceler_type
      - created_at
      description: Provides data pertaining to the cancellation of the Event or the Invitee
      title: Cancellation
    InviteeAssociatedNoShow:
      type: object
      properties:
        uri:
          type: string
          description: Canonical reference (unique identifier) for the no show
        created_at:
          type: string
          format: date-time
          description: The moment when the no show was created
      required:
      - uri
      - created_at
      description: Provides data pertaining to the associated no show for the Invitee
      title: InviteeAssociatedNoShow
    CreateInviteeNoShowRequestForbiddenError0:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/InviteeNoShowsPostResponsesContentApplicationJsonSchemaOneOf0Title'
        message:
          $ref: '#/components/schemas/InviteeNoShowsPostResponsesContentApplicationJsonSchemaOneOf0Message'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: CreateInviteeNoShowRequestForbiddenError0
    InviteeSpecifiedLocationType:
      type: string
      enum:
      - ask_invitee
      description: The event location selected by the invitee
      title: InviteeSpecifiedLocationType
    List-scheduled-eventsRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/ScheduledEventsGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/ScheduledEventsGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: List-scheduled-eventsRequestInternalServerError
    InviteeNoShow:
      type: object
      properties:
        uri:
          type: string
          format: uri
          description: Canonical reference (unique identifier) for the no show
        invitee:
          type: string
          format: uri
          description: Canonical reference (unique identifier) for the associated Invitee
        created_at:
          type: string
          format: date-time
          description: The moment when the no show was created
      required:
      - uri
      - invitee
      - created_at
      description: Information about an invitees no show.
      title: InviteeNoShow
    GetScheduledEventsError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/GetScheduledEventsErrorTitle'
        message:
