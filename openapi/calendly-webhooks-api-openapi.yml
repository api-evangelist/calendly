openapi: 3.2.0
info:
  title: Calendly Webhooks API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: Webhooks
paths:
  /webhook_subscriptions:
    post:
      operationId: webhooks_create-webhook-subscription
      summary: Create Webhook Subscription
      description: 'Create a Webhook Subscription for an Organization, User, or Group.


        * The `organization` subscription scope triggers the webhook for all subscribed events within the organization.

        * The `user` subscription scope only triggers the webhook for subscribed events that belong to the specific user.

        * The `group` subscription scope only triggers the webhook for subscribed events that belong to the specfic group.


        | Event | Allowed Subscription Scopes | Required Auth Scope |

        | ----- | ----- | ----- |

        | invitee.created | `organization` `user` `group` | `scheduled_events:read` |

        | invitee.canceled | `organization` `user` `group` | `scheduled_events:read` |

        | invitee_no_show.created | `organization` `user` `group` | `scheduled_events:read` |

        | invitee_no_show.deleted | `organization` `user` `group` | `scheduled_events:read` |

        | event_type.created | `organization` `user` `group` | `event_types:read` |

        | event_type.deleted | `organization` `user` `group` | `event_types:read` |

        | event_type.updated | `organization` `user` `group` | `event_types:read` |

        | meeting_recap.created | `user` | `meeting_recaps:read` |

        | meeting_recap.updated | `user` | `meeting_recaps:read` |

        | meeting_recap.deleted | `user` | `meeting_recaps:read` |

        | routing_form_submission.created | `organization`

        Create separate Webhook Subscriptions for events with different subscription scopes. | `routing_forms:read` |

        | contact.created | `organization` `user` `group` | `contacts:read` |

        | contact.updated | `organization` `user` `group` | `contacts:read` |

        | contact.deleted | `organization` `user` `group` | `contacts:read` |


        > `webhooks:write`'
      tags:
      - Webhooks
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_create-webhook-subscription_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatewebhooksRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatewebhooksRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatewebhooksRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatewebhooksRequestNotFoundError'
        '409':
          description: Attempt to create a resource that already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatewebhooksRequestConflictError'
        '503':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatewebhooksRequestServiceUnavailableError'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL where you want to receive POST requests for events you are subscribed to.
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookSubscriptionsPostRequestBodyContentApplicationJsonSchemaEventsItems'
                  description: List of user events to subscribe to.
                organization:
                  type: string
                  format: uri
                  description: The unique reference to the organization that the webhook will be tied to.
                user:
                  type: string
                  format: uri
                  description: The unique reference to the user that the webhook will be tied to.
                group:
                  type: string
                  format: uri
                  description: The unique reference to the group that the webhook will be tied to.
                scope:
                  $ref: '#/components/schemas/WebhookSubscriptionsPostRequestBodyContentApplicationJsonSchemaScope'
                  description: Indicates whether the webhook subscription scope is `organization`, `user`, or `group`
                signing_key:
                  type: string
                  description: Optional secret key shared between your application and Calendly. See https://developer.calendly.com/api-docs/overview/webhooks/webhook-signatures for additional information.
              required:
              - url
              - events
              - organization
              - scope
      security:
      - oauth2: []
    get:
      operationId: webhooks_list-webhook-subscriptions
      summary: List Webhook Subscriptions
      description: 'Get a list of Webhook Subscriptions for a specified Organization, User, or Group.


        > `webhooks:read`'
      tags:
      - Webhooks
      parameters:
      - name: organization
        in: query
        description: The given organization that owns the subscriptions being returned. This field is always required.
        required: true
        schema:
          type: string
          format: uri
      - name: user
        in: query
        description: Indicates if the results should be filtered by user. This parameter is only required if the `scope` parameter is set to `user`.
        required: false
        schema:
          type: string
          format: uri
      - name: group
        in: query
        description: Indicates if the results should be filtered by group. This parameter is only required if the `scope` parameter is set to `group`.
        required: false
        schema:
          type: string
          format: uri
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        description: 'Order results by the specified field and direction. Accepts comma-separated list of {field}:{direction} values.

          Supported fields are: created_at.

          Sort direction is specified as: asc, desc.'
        required: false
        schema:
          type: string
      - name: scope
        in: query
        description: Filter the list by organization, user, or group
        required: true
        schema:
          $ref: '#/components/schemas/WebhookSubscriptionsGetParametersScope'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_list-webhook-subscriptions_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-webhook-subscriptionsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-webhook-subscriptionsRequestUnauthorizedError'
        '403':
          description: Permission Denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-webhook-subscriptionsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-webhook-subscriptionsRequestNotFoundError'
      security:
      - oauth2: []
  /webhook_subscriptions/{webhook_uuid}:
    delete:
      operationId: webhooks_delete-webhook-subscription
      summary: Delete Webhook Subscription
      description: 'Delete a Webhook Subscription.


        > `webhooks:write`'
      tags:
      - Webhooks
      parameters:
      - name: webhook_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-webhook-subscriptionRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-webhook-subscriptionRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-webhook-subscriptionRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-webhook-subscriptionRequestInternalServerError'
      security:
      - oauth2: []
    get:
      operationId: webhooks_get-webhook-subscription
      summary: Get Webhook Subscription
      description: 'Get a specified Webhook Subscription.


        > `webhooks:read`'
      tags:
      - Webhooks
      parameters:
      - name: webhook_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_get-webhook-subscription_Response_200'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-webhook-subscriptionRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-webhook-subscriptionRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-webhook-subscriptionRequestNotFoundError'
      security:
      - oauth2: []
  /sample_webhook_data:
    get:
      operationId: webhooks_get-sample-webhook-data
      summary: Get sample webhook data
      description: 'Test your webhook subscription


        > `webhooks:read`'
      tags:
      - Webhooks
      parameters:
      - name: event
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SampleWebhookDataGetParametersEvent'
      - name: organization
        in: query
        required: true
        schema:
          type: string
          format: uri
      - name: user
        in: query
        required: false
        schema:
          type: string
          format: uri
      - name: scope
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SampleWebhookDataGetParametersScope'
      - name: group
        in: query
        required: false
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPayload'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-sample-webhook-dataRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-sample-webhook-dataRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-sample-webhook-dataRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-sample-webhook-dataRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-sample-webhook-dataRequestInternalServerError'
      security:
      - oauth2: []
components:
  schemas:
    CreatewebhooksRequestServiceUnavailableError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/WebhookSubscriptionsPostResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/WebhookSubscriptionsPostResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: CreatewebhooksRequestServiceUnavailableError
    ZoomConferenceDataSettingsGlobalDialInNumbersItems:
      type: object
      properties:
        number:
          type: string
          description: Phone number
        country:
          type: string
          description: Country code
        type:
          type: string
        city:
          type: string
        country_name:
          type: string
      title: ZoomConferenceDataSettingsGlobalDialInNumbersItems
    InsufficientScopeError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/InsufficientScopeErrorTitle'
        message:
          $ref: '#/components/schemas/InsufficientScopeErrorMessage'
        required_scopes:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+:(read|write)$
      required:
      - title
      - message
      - required_scopes
      description: Caller does not have required oauth scopes
      title: InsufficientScopeError
    WebhookPayloadEvent:
      type: string
      enum:
      - invitee.created
      - invitee.canceled
      - invitee_no_show.created
      - invitee_no_show.deleted
      - routing_form_submission.created
      - event_type.created
      - event_type.deleted
      - event_type.updated
      - meeting_recap.created
      - meeting_recap.updated
      - meeting_recap.deleted
      - contact.created
      - contact.updated
      - contact.deleted
      description: The event that caused the webhook to fire
      title: WebhookPayloadEvent
    Get-sample-webhook-dataRequestInternalServerError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/SampleWebhookDataGetResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/SampleWebhookDataGetResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Get-sample-webhook-dataRequestInternalServerError
    Guest:
      type: object
      properties:
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - email
      - created_at
      - updated_at
      description: An individual whom an invitee has invited to be a guest attendee to an event
      title: Guest
    ContactDeletedWebhookPayload:
      type: object
      properties:
        user_uuid:
          type: string
          format: uuid
          description: User unique identifier
        contact:
          $ref: '#/components/schemas/ContactDeletedWebhookPayloadContact'
          description: Deleted contact snapshot
      required:
      - user_uuid
      - contact
      description: Payload for `contact.deleted` (`user_uuid` plus nested `contact` with `uri` and `deleted_at`).
      title: ContactDeletedWebhookPayload
    WebhookSubscriptionEventsItems:
      type: string
      enum:
      - invitee.created
      - invitee.canceled
      - invitee_no_show.created
      - invitee_no_show.deleted
      - meeting_recap.created
      - meeting_recap.updated
      - meeting_recap.deleted
      - routing_form_submission.created
      - contact.created
      - contact.updated
      - contact.deleted
      title: WebhookSubscriptionEventsItems
    webhooks_list-webhook-subscriptions_Response_200:
      type: object
      properties:
        collection:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - collection
      - pagination
      title: webhooks_list-webhook-subscriptions_Response_200
    Delete-webhook-subscriptionRequestNotFoundError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/WebhookSubscriptionsWebhookUuidDeleteResponsesContentApplicationJsonSchemaTitle'
        message:
          $ref: '#/components/schemas/WebhookSubscriptionsWebhookUuidDeleteResponsesContentApplicationJsonSchemaMessage'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseDetailsItem'
      required:
      - title
      - message
      description: Error Object
      title: Delete-webhook-subscriptionRequestNotFoundError
    Cancellation:
      type: object
      properties:
        canceled_by:
          type: string
          description: Name of the person whom canceled
        reason:
          type:
          - string
          - 'null'
          description: Reason that the cancellation occurred
        canceler_type:
          $ref: '#/components/schemas/CancellationCancelerType'
        created_at:
          type: string
          format: date-time
          description: The moment when the cancellation was created
      required:
      - canceled_by
      - reason
      - canceler_type
      - created_at
      description: Provides data pertaining to the cancellation of the Event or the Invitee
      title: Cancellation
    MeetingRecapDeletedWebhookPayload:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/MeetingRecapDeletedWebhookPayloadEvent'
          description: Related scheduled event reference
        recap:
          $ref: '#/components/schemas/MeetingRecapDeletedWebhookPayloadRecap'
          description: Deleted meeting recap resource reference
      required:
      - recap
      description: V2 webhook payload for `meeting_recap.deleted`
      title: MeetingRecapDeletedWebhookPayload
    ContactUpdatedWebhookPayload:
      type: object
      properties:
        user_uuid:
          type: string
          format: uuid
          description: User unique identifier
        contact:
          $ref: '#/components/schemas/ContactUpdatedWebhookPayloadContact'
          description: Contact record for this event.
      required:
      - user_uuid
      - contact
      description: Payload for `contact.updated` (`user_uuid` plus `contact`).
      title: ContactUpdatedWebhookPayload
    InviteePayloadScheduledEvent:
      type: object
      properties:
        uri:
          type: string
          format: uri
          description: Canonical reference (unique identifier) for the resource
        name:
          type:
          - string
          - 'null'
          description: The event name
        meeting_notes_plain:
          type:
          - string
          - 'null'
          description: The event's meeting notes (in non formatted text)
        meeting_notes_html:
          type: string
          description: The event's meeting notes (formatted with HTML)
        status:
          $ref: '#/components/schemas/InviteePayloadScheduledEventStatus'
          description: Indicates if the event is "active" or "canceled"
        start_time:
          type: string
          format: date-time
          description: The moment the event was scheduled to start in UTC time (e.g. "2020-01-02T03:04:05.678123Z").
        end_time:
          type: string
          format: date-time
          description: The moment the event was scheduled to end in UTC time (e.g. "2020-01-02T03:04:05.678123Z")
        event_type:
          type: string
          format: uri
          description: The event type associated with this event
        location:
          $ref: '#/components/schemas/Location'
        invitees_counter:
          $ref: '#/components/schemas/InviteePayloadScheduledEventInviteesCounter'
        created_at:
          type: string
          format: date-time
          description: The moment when the event was created (e.g. "2020-01-02T03:04:05.678123Z")
        updated_at:
          type: string
          format: date-time
          description: The moment when the event was last updated (e.g. "2020-01-02T03:04:05.678123Z")
        event_memberships:
          type: array
          items:
            $ref: '#/components/schemas/InviteePayloadScheduledEventEventMembershipsItems'
          description: Event membership list
        event_guests:
          type: array
          items:
            $ref: '#/components/schemas/Guest'
          description: Additional people added to an event by an invitee
        cancellation:
          $ref: '#/components/schemas/Cancellation'
      required:
      - uri
      - name
      - status
      - start_time
      - end_time
      - event_type
      - location
      - invitees_counter
      - created_at
      - updated_at
      - event_memberships
      - event_guests
      description: Information about the invitee's scheduled meeting
      title: InviteePayloadScheduledEvent
    WebhookSubscriptionsWebhookUuidDeleteResponsesContentApplicationJsonSchemaOneOf0Title:
      type: string
      enum:
      - Permission Denied
      title: WebhookSubscriptionsWebhookUuidDeleteResponsesContentApplicationJsonSchemaOneOf0Title
    EventTypeCustomQuestion:
      type: object
      properties:
        name:
          type: string
          description: The custom question that the host created for the event type.
        type:
          $ref: '#/components/schemas/EventTypeCustomQuestionType'
          description: The type of response that the invitee provides to the custom question; can be one or multiple lines of text, a phone number, or single- or multiple-select.
        position:
          type: integer
          description: The numerical position of the question on the event booking page after the name and email address fields.
        enabled:
          type: boolean
          description: true if the question created by the host is turned ON and visible on the event booking page; false if turned OFF and invisible on the event booking page.
        required:
          type: boolean
          description: true if a response to the question created by the host is required for invitees to book the event type; false if not required.
        answer_choices:
          type: array
          items:
            type: string
          description: The invitee’s option(s) for single_select or multi_select type of responses.
        include_other:
          type: boolean
          description: true if the custom question lets invitees record a written response in addition to single-select or multiple-select type of responses; false if it doesn’t.
      required:
      - name
      - type
      - position
      - enabled
      - required
      - answer_choices
      - include_other
      title: EventTypeCustomQuestion
    InviteeSpecifiedLocationType:
      type: string
      enum:
      - ask_invitee
      description: The event location selected by the invitee
      title: InviteeSpecifiedLocationType
    GetWebhookSubscriptionsError:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/GetWebhookSubscriptionsErrorTitle'
        message:
          $ref: '#/components/schemas/GetWebhookSubscriptionsErrorMessage'
      description: Permission Denied
      title: GetWebhookSubscriptionsError
    EventTypePayloadKind:
      type: string
      enum:
      - solo
      - group
      description: Indicates if the event type is "solo" (belongs to an individual user) or "group"
      title: EventTypePayloadKind
    MeetingRecapCreatedWebhookPayloadEventAttendeesItems:
      type: object
      properties:
        host:
          type: boolean
        user_email:
          type: string
          format: email
        user_name:
          type: string
      required:
      - host
      - user_email
      - user_name
      title: MeetingRecapCreatedWebhookPayloadEventAttendeesItems
    List-webhook-subscriptionsRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/GetWebhookSubscriptionsError'
      - $ref: '#/components/schemas/InsufficientScopeError'
      title: List-webhook-subscriptionsRequestForbiddenError
    SubmissionCustomMessageResultType:
      type: string
      enum:
      - custom_message
      description: Indicates if the routing form submission resulted in a custom "thank you" message.
      title: SubmissionCustomMessageResultType
    SampleWebhookDataGetResponsesContentApplicationJsonSchemaOneOf0Message:
      type: string
      enum:
      - You do not have permission to access this resource.
      - You do not have permission
      title: SampleWebhookDataGetResponsesContentApplicationJsonSchemaOneOf0Message
    MeetingRecapCreatedWebhookPayloadRecap:
      type: object
      properties:
        uri:
          type: string
          format: uri
          description: Meeting recap resource URI
        summary_md:
          type: string
          description: Markdown summary of the meeting
        action_items_md:
          type: string
          description: Markdown action items from the meeting
        discussion_md:
          type: string
          description: Markdown discussion points
        transcript:
          type: string
          format: uri
          description: Transcript resource URI
        share_link:
          type: string
          format: uri
          description: URL for sharing this meeting recap with others. Access is determined by the recap’s sharing settings.
        created_at:
          type: string
          format: date-time
          description: When the meeting recap was created
        updated_at:
          type: string
          format: date-time
          description: When the meeting recap was last updated
      required:
      - uri
      - transcript
      description: Meeting recap resource references and content
      title: MeetingRecapCreatedWebhookPayloadRecap
    ZoomConferenceDataId:
      oneOf:
      - type: string
      - type: integer
      description: The conference ID provided by Zoom
      title: ZoomConferenceDataId
    Get-sample-webhook-dataRequestForbiddenError:
      oneOf:
      - $ref: '#/components/schemas/GetSampleWebhookDataRequestForbiddenError0'
      - $ref: '#/components/schemas/InsufficientScopeError'
      title: Get-sample-webhook-dataRequestForbiddenError
    WebhookSubscriptionsGetResponsesContentApplicationJsonSchemaTitle:
      type: string
      enum:
      - Resource Not Found
      title: WebhookSubscriptionsGetResponsesContentApplicationJsonSchemaTitle
    MicrosoftTeamsConferenceData:
      type: object
      properties:
        id:
          type: string
          description: The conference ID provided by Microsoft Teams
        audioConferencing:
          oneOf:
          - $ref: '#/components/schemas/MicrosoftTeamsConferenceDataAudioConferencing'
          - type: 'null'
      description: The conference metadata supplied by Microsoft Teams
      title: MicrosoftTeamsConferenceData
    SubmissionEventTypeResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SubmissionEventTypeResultType'
          description: Indicates that the routing form submission resulted in a redirect to an event type booking page.
        value:
          type: string
          format: uri
          description: A reference to the event type resource.
      required:
      - type
      - value
      description: Information about the event type Routing Form Submission result.
      title: SubmissionEventTypeResult
    MeetingRecapUpdatedWebhookPayload:
      type: object
      properties:
