openapi: 3.2.0
info:
  title: Calendly Routing Forms API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: routingForms
paths:
  /routing_forms/{uuid}:
    get:
      operationId: routingForms_get-routing-form
      summary: Get Routing Form
      description: 'Get a specified Routing Form.


        > `routing_forms:read`'
      tags:
      - routingForms
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routingForms_get-routing-form_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-formRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-formRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-formRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-formRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-formRequestInternalServerError'
      security:
      - oauth2: []
  /routing_form_submissions/{uuid}:
    get:
      operationId: routingForms_get-routing-form-submission
      summary: Get Routing Form Submission
      description: 'Get a specified Routing Form Submission.


        > `routing_forms:read`'
      tags:
      - routingForms
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routingForms_get-routing-form-submission_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-form-submissionRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-form-submissionRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-form-submissionRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-form-submissionRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-routing-form-submissionRequestInternalServerError'
      security:
      - oauth2: []
  /routing_form_submissions:
    get:
      operationId: routingForms_list-routing-form-submissions
      summary: List Routing Form Submissions
      description: 'Get a list of Routing Form Submissions for a specified Routing Form.


        > `routing_forms:read`'
      tags:
      - routingForms
      parameters:
      - name: form
        in: query
        description: View routing form submissions associated with the routing form's URI.
        required: true
        schema:
          type: string
          format: uri
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: 'Order results by the specified field and direction. Accepts comma-separated list of {field}:{direction} values. Supported fields are: created_at. Sort direction is specified as: asc, desc.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routingForms_list-routing-form-submissions_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-form-submissionsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-form-submissionsRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-form-submissionsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-form-submissionsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-form-submissionsRequestInternalServerError'
      security:
      - oauth2: []
  /routing_forms:
    get:
      operationId: routingForms_list-routing-forms
      summary: List Routing Forms
      description: 'Get a list of Routing Forms for a specified Organization.


        > `routing_forms:read`'
      tags:
      - routingForms
      parameters:
      - name: organization
        in: query
        description: View organization routing forms associated with the organization's URI.
        required: true
        schema:
          type: string
          format: uri
      - name: count
        in: query
        description: The number of rows to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page_token
        in: query
        description: The token to pass to get the next or previous portion of the collection
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: 'Order results by the specified field and direction. Accepts comma-separated list of {field}:{direction} values. Supported fields are: created_at. Sort direction is specified as: asc, desc.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routingForms_list-routing-forms_Response_200'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-formsRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-formsRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-formsRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-formsRequestNotFoundError'
        '500':
          description: An error has occurred on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-routing-formsRequestInternalServerError'
      security:
      - oauth2: []
