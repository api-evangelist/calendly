openapi: 3.2.0
info:
  title: Calendly Shares API
  version: 1.0.0
servers:
- url: https://api.calendly.com
  description: https://api.calendly.com
tags:
- name: Shares
paths:
  /shares:
    post:
      operationId: shares_create-share
      summary: Create Share
      description: 'Endpoint for our Customize Once and Share feature. This allows you to customize events for a specific invitee without needing to make an entirely new event type.

        ***This feature is only available for one-on-one event types.***

        **Note: Any parameter which is not provided in the request body will be copied from the target event type.**


        > `shares:write`'
      tags:
      - Shares
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shares_create-share_Response_201'
        '400':
          description: Request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-shareRequestBadRequestError'
        '401':
          description: Cannot authenticate caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-shareRequestUnauthorizedError'
        '403':
          description: Permission denied or insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-shareRequestForbiddenError'
        '404':
          description: Requested resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-shareRequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  format: uri
                name:
                  type: string
                  maxLength: 55
                duration:
                  type: integer
                  minimum: 1
                  maximum: 720
                  description: Must be one of the provided duration options. If duration options aren't provided then duration must be one of the duration options inherited from the event type.
                duration_options:
                  type: array
                  items:
                    type: integer
                  description: A maximum of 4 unique options is allowed. Each option must be >= 1 and <= 720.
                period_type:
                  $ref: '#/components/schemas/SharesPostRequestBodyContentApplicationJsonSchemaPeriodType'
                start_date:
                  type: string
                  format: date
                  description: 'is required when `period_type` is ''fixed''

                    Format: `YYYY-MM-DD`'
                end_date:
                  type: string
                  format: date
                  description: 'is required when `period_type` is ''fixed''

                    Format: `YYYY-MM-DD`'
                max_booking_time:
                  type: integer
                  description: is required when `period_type` is 'moving' or 'available_moving'
                hide_location:
                  type: boolean
                  description: determines if a location is hidden until invitee books a spot, only respected when there is a single custom location configured
                location_configurations:
                  type: array
                  items:
                    $ref: '#/components/schemas/SharesPostRequestBodyContentApplicationJsonSchemaLocationConfigurationsItems'
                availability_rule:
                  $ref: '#/components/schemas/SharesPostRequestBodyContentApplicationJsonSchemaAvailabilityRule'
              required:
              - event_type
      security:
      - oauth2: []
